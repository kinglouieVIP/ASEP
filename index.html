      <b style="font-family:var(--disp);font-size:17px">Mixed set</b>
      <div class="chips">${Object.entries(AREAS).map(([k,v])=>`<button class="chip" data-a="${k}" aria-pressed="${mixSel.has(k)}">${v}</button>`).join("")}</div>
      <div class="chips">${[12,25,0].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${mixN===n}">${n?n+" items":"All"}</button>`).join("")}</div>
      <button class="btn full" id="mMix" style="margin-top:8px">Start mixed set</button>
    </div>
    <p class="small muted">${Q.length} items, all original and written against the SEH 5th Ed structure. Not INCOSE material. Each one is stamped with the clause to re-read if you miss it.</p>`;
  main.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.a;if(mixSel.has(k)&&mixSel.size>1)mixSel.delete(k);else mixSel.add(k);b.setAttribute("aria-pressed",mixSel.has(k));}));
  main.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>{mixN=+b.dataset.n;main.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",x===b));}));
  document.getElementById("mWeak").addEventListener("click",()=>startDrill("weak"));
  document.getElementById("mMiss").addEventListener("click",()=>startDrill("misses"));
  document.getElementById("mMock").addEventListener("click",()=>startDrill("mock"));
  document.getElementById("mMix").addEventListener("click",()=>startDrill("mixed"));
}

function pickWeak(n){
  const as={};areaStats().forEach(s=>as[s.k]=s.n?s.acc:.5);
  const scored=shuffle(Q).map(q=>{const it=S.items[q.id];let sc;
    if(it&&it.lw)sc=0; else if(!it)sc=1; else sc=2+Math.min(it.st,3);
    sc+=as[q.a]; return {q,sc};});
  scored.sort((a,b)=>a.sc-b.sc);
  return scored.slice(0,n).map(x=>x.q);
}
function startDrill(mode){
  let set;
  if(mode==="weak")set=pickWeak(15);
  else if(mode==="misses")set=shuffle(Q.filter(q=>S.items[q.id]&&S.items[q.id].lw));
  else if(mode==="mock")set=shuffle(Q).slice(0,50);
  else {const pool=shuffle(Q.filter(q=>mixSel.has(q.a)));set=mixN?pool.slice(0,mixN):pool;}
  if(!set.length)return;
  set=set.map(q=>({q,opts:shuffle(q.o.map((t,i)=>({t,ok:i===q.k})))}));
  D={active:true,mode,set,i:0,r:0,log:[],answered:false,done:false};
  if(mode==="mock"){D.t0=Date.now();D.limit=3600;clearInterval(D.tick);D.tick=setInterval(mockTick,1000);}
  rQuestion();
}
function mockTick(){
  if(!D.active||D.mode!=="mock"||D.done){clearInterval(D.tick);return;}
  const left=D.limit-(Date.now()-D.t0)/1000;
  const el=document.getElementById("mockT"); if(el)el.textContent=mmss(left);
  if(left<=0){endDrill(true);}
}
function rQuestion(){
  if(TAB!=="drill")return;
  const it=D.set[D.i], q=it.q, mock=D.mode==="mock";
  main.innerHTML=`
    <div class="qmeta">
      <div class="qid"><span class="tag">${q.a}</span>§${q.c}</div>
      <div class="qid">${D.i+1}/${D.set.length}${mock?` · <span id="mockT">${mmss(D.limit-(Date.now()-D.t0)/1000)}</span>`:` · ${D.r} correct`}</div>
    </div>
    <div class="progressbar"><i style="width:${D.i/D.set.length*100}%"></i></div>
    <p class="qtext">${q.q}</p>
    <div>${it.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="lt">${"ABCD"[j]}</span><span>${o.t}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row" id="nav"><button class="btn ghost" id="quit">End set</button></div>`;
  D.answered=false;
  main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.j)));
  document.getElementById("quit").addEventListener("click",()=>endDrill(false));
}
function pick(j){
  if(D.answered)return; D.answered=true;
  const it=D.set[D.i], ok=it.opts[j].ok;
  if(ok)D.r++;
  record(it.q,ok); D.log.push({it,ok,j}); save();
  if(D.mode==="mock"){D.i++; if(D.i>=D.set.length)endDrill(); else rQuestion(); return;}
  main.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(it.opts[k].ok)b.classList.add("correct");else if(k===j)b.classList.add("wrong");});
  document.getElementById("fb").innerHTML=`<div class="why"><b>${ok?"Correct":"Not this one"} · re-read §${it.q.c}</b>${it.q.w}</div>`;
  const last=D.i+1>=D.set.length;
  document.getElementById("nav").innerHTML=`<button class="btn" id="next">${last?"See results":"Next"}</button>`;
  const nx=document.getElementById("next"); nx.focus({preventScroll:true});
  nx.addEventListener("click",()=>{D.i++; if(D.i>=D.set.length)endDrill(); else {rQuestion();window.scrollTo(0,0);}});
}
function endDrill(timeout){
  if(D.done)return;
  clearInterval(D.tick);
  const n=(D.mode==="mock"&&timeout===true)?D.set.length:D.log.length;
  D.timeout=timeout===true;
  if(n>0){S.sets.push({d:Date.now(),mode:D.mode,n,r:D.r}); while(S.sets.length>40)S.sets.shift(); save();}
  D.done=true; D.total=n;
  D.became=checkReady();
  if(TAB==="drill")rDrillResult();
}
function rDrillResult(){
  const n=D.total, p=pct(D.r,n);
  const verdict=!n?"No items answered":p>=80?"Exam pace — keep it there":p>=65?"Close — work the misses below":"Not yet — re-read the stamped clauses";
  const by={};D.log.forEach(l=>{const a=l.it.q.a;by[a]=by[a]||{n:0,r:0};by[a].n++;if(l.ok)by[a].r++;});
  const wrong=D.log.filter(l=>!l.ok);
  const unanswered=D.timeout?D.set.length-D.log.length:0;
  main.innerHTML=`
    ${D.became?`<div class="go-banner"><b>Ready to book</b><p>That set lit the last readiness check. Book the online-proctored exam.</p></div>`:""}
    <h2>${D.mode==="mock"?"Mock result":"Set result"}</h2>
    <div class="big">${p}<span style="font-size:26px">%</span></div>
    <div class="verdict">${D.r}/${n} · ${verdict}</div>
    ${unanswered?`<p class="small muted" style="text-align:center">${unanswered} unanswered when time ran out — counted as wrong.</p>`:""}
    ${n<25&&D.mode!=="mock"?`<p class="small muted" style="text-align:center">Sets under 25 items don't count toward the 80% readiness check.</p>`:""}
    <div class="eyebrow mono">By area, weakest first</div>
    ${Object.entries(by).sort((a,b)=>a[1].r/a[1].n-b[1].r/b[1].n).map(([k,v])=>`<div class="kv"><span>${AREAS[k]}</span><span>${v.r}/${v.n} · ${pct(v.r,v.n)}%</span></div>`).join("")}
    ${wrong.length?`<div class="eyebrow mono">What you missed</div>${wrong.map(l=>`<div class="miss"><div>${l.it.q.q}</div><div class="a" style="margin-top:4px">${l.it.opts.find(o=>o.ok).t}</div><div class="muted small" style="margin-top:4px">§${l.it.q.c} · ${l.it.q.w}</div></div>`).join("")}`:""}
    <div class="row"><button class="btn" id="again">New set</button><button class="btn ghost" id="toToday">Readiness</button></div>`;
  document.getElementById("again").addEventListener("click",()=>{D={active:false};rDrill();});
  document.getElementById("toToday").addEventListener("click",()=>{D={active:false};go("today");});
}

/* ================= RECALL SPRINT ================= */
let R={active:false};
function norm(s){return s.toLowerCase().replace(/&/g," and ").replace(/\bmgmt\b|\bmgt\b/g,"management").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();}
function matchProc(s){const n=norm(s);if(!n)return null;for(const id of MATCH_ORDER){if(PI[id].rx.test(n))return PI[id];}return null;}

function rRecall(){
  if(R.active)return rRecallActive();
  if(R.done)return rRecallDone();
  const att=S.recall.slice(-5).reverse();
  const full=S.recall.filter(r=>r.full), best=full.length?Math.min(...full.map(r=>r.secs)):null;
  main.innerHTML=`
    <h2>Recall sprint</h2>
    <div class="card">
      <p style="margin:0">Name all 30 life cycle processes from memory, in the right groups. Tap a group, type a process, press return. Short forms work — "config", "QA", "stakeholder".</p>
      <p>Target: <b>30/30 in 6:00</b>. A name typed under the wrong group counts as an error and isn't placed.</p>
    </div>
    <div class="kv"><span>Best full recall</span><span>${best!==null?mmss(best):"—"}</span></div>
    <div class="kv"><span>Attempts</span><span>${S.recall.length}</span></div>
    ${att.length?`<div class="eyebrow mono">Recent</div>${att.map(a=>`<div class="kv"><span>${dstr(a.d)}</span><span>${a.n}/30 · ${mmss(a.secs)} · ${a.errs} err</span></div>`).join("")}`:""}
    <div class="row"><button class="btn full" id="rgo">Start the clock</button></div>
    <p class="small muted">Not ready to test yourself? The full list with one-line purposes is under Learn → The 30 processes.</p>`;
  document.getElementById("rgo").addEventListener("click",startRecall);
}
function startRecall(){
  R={active:true,t0:Date.now(),found:{},errs:0,g:"AGR",msg:"",cls:""};
  clearInterval(R.tick); R.tick=setInterval(recallTick,500);
  rRecallActive();
  const inp=document.getElementById("rin"); if(inp)inp.focus();
}
function recallTick(){
  if(!R.active){clearInterval(R.tick);return;}
  const el=document.getElementById("rt"); if(!el)return;
  const s=(Date.now()-R.t0)/1000; el.textContent=mmss(s); el.classList.toggle("over",s>360);
}
function rRecallActive(){
  if(TAB!=="recall")return;
  const s=(Date.now()-R.t0)/1000;
  const count=g=>PROCS.filter(p=>p.g===g&&R.found[p.id]).length;
  const total=Object.keys(R.found).length;
  main.innerHTML=`
    <div class="timer${s>360?" over":""}" id="rt">${mmss(s)}</div>
    <div class="target">target 06:00 · ${total}/30 · ${R.errs} err</div>
    <div class="groups">${GROUPS.map(g=>{const tot=PROCS.filter(p=>p.g===g.k).length;
      return `<button class="grp" data-g="${g.k}" aria-pressed="${R.g===g.k}"><b>${g.n}</b><span>${count(g.k)}/${tot}</span></button>`;}).join("")}</div>
    <div class="entry">
      <input id="rin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Process in ${esc(GROUPS.find(g=>g.k===R.g).n)}" aria-label="Process name">
      <button class="btn" id="radd">Add</button>
    </div>
    <div class="fb ${R.cls}" id="rfb" role="status">${R.msg}</div>
    <div class="found">${GROUPS.map(g=>{const f=PROCS.filter(p=>p.g===g.k&&R.found[p.id]);return f.length?`<div class="gl">${g.n}</div>${f.map(p=>`<span class="pill">${p.name}</span>`).join("")}`:"";}).join("")}</div>
    <div class="row"><button class="btn ghost" id="rend">Finish</button></div>`;
  main.querySelectorAll(".grp").forEach(b=>b.addEventListener("click",()=>{R.g=b.dataset.g;R.msg="";rRecallActive();document.getElementById("rin").focus();}));
  const inp=document.getElementById("rin");
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addRecall();}});
  document.getElementById("radd").addEventListener("click",addRecall);
  document.getElementById("rend").addEventListener("click",endRecall);
}
function addRecall(){
  const inp=document.getElementById("rin"); const v=inp.value; if(!v.trim())return;
  const p=matchProc(v);
  if(!p){R.msg=`No match for "${esc(v)}" — be more specific`;R.cls="bad";}
  else if(R.found[p.id]){R.msg=`${p.name} already listed`;R.cls="";}
  else if(p.g!==R.g){R.errs++;R.msg=`Not in ${GROUPS.find(g=>g.k===R.g).n}`;R.cls="bad";}
  else {R.found[p.id]=1;R.msg=`✓ ${p.name}`;R.cls="ok";}
  if(Object.keys(R.found).length===30)return endRecall();
  rRecallActive();
  const ni=document.getElementById("rin"); ni.value=""; ni.focus();
}
function endRecall(){
  clearInterval(R.tick);
  const secs=(Date.now()-R.t0)/1000, n=Object.keys(R.found).length;
  S.recall.push({d:Date.now(),secs:Math.round(secs),n,errs:R.errs,full:n===30}); while(S.recall.length>50)S.recall.shift();
  save();
  R={active:false,done:true,secs,n,errs:R.errs,found:R.found,became:checkReady()};
  rRecallDone();
}
function rRecallDone(){
  const hit=R.n===30&&R.secs<=360;
  main.innerHTML=`
    ${R.became?`<div class="go-banner"><b>Ready to book</b><p>That sprint lit the last readiness check.</p></div>`:""}
    <h2>Sprint result</h2>
    <div class="big">${R.n}<span style="font-size:26px">/30</span></div>
    <div class="verdict">${mmss(R.secs)} · ${R.errs} wrong-group · ${hit?"target met":R.n===30?"all found — now get it under 6:00":"not yet"}</div>
    ${R.n<30?`<div class="eyebrow mono">Missing</div>${GROUPS.map(g=>{const m=PROCS.filter(p=>p.g===g.k&&!R.found[p.id]);return m.length?`<div class="gl mono small muted" style="margin:10px 0 4px">${g.n}</div>${m.map(p=>`<span class="pill missing">${p.name}</span>`).join("")}`:"";}).join("")}`:""}
    <div class="row"><button class="btn" id="ragain">Go again</button><button class="btn ghost" id="rback">Back</button></div>`;
  document.getElementById("ragain").addEventListener("click",()=>{R={active:false};startRecall();});
  document.getElementById("rback").addEventListener("click",()=>{R={active:false};rRecall();});
}

/* ================= LEARN ================= */
function rLearn(){
  const procList=GROUPS.map(g=>`<h4>${g.n} · §${g.c}</h4>${PROCS.filter(p=>p.g===g.k).map(p=>`<div class="pr"><span class="c">${p.c}</span><span><b>${p.name}</b> — ${p.purpose}</span></div>`).join("")}`).join("");
  const sec=(t,b,open)=>`<details${open?" open":""}><summary>${t}</summary><div class="lbody">${b}</div></details>`;
  main.innerHTML=`<h2>Learn</h2>
  ${sec("Exam facts and technique",`
    <ul>
      <li>100 multiple-choice questions, 120 minutes — about 72 seconds each.</li>
      <li>Online with a remote proctor, or on paper at INCOSE events.</li>
      <li>Content is solely the SE Handbook 5th Ed (since 15 March 2025).</li>
      <li>Learning objectives are pitched at awareness level and cover Parts 1–5. Chapter 6 case studies are not listed.</li>
      <li>INCOSE sells an official 10-question practice test for $10. Take it once early to calibrate the question style.</li>
    </ul>
    <h4>Technique</h4>
    <ul>
      <li>The handbook's wording is the answer key, even where your programme or customer uses terms differently.</li>
      <li>Watch qualifiers: best, first, primary, most.</li>
      <li>Two options often differ by one word — "specified requirements" vs "stakeholder needs" is the V&amp;V tell.</li>
      <li>Eliminate, pick, flag, move on. Don't spend three minutes on one item.</li>
    </ul>`,true)}
  ${sec("The 30 processes",procList)}
  ${sec("Reviews, audits, baselines",`
    <div class="pr"><span class="c">Functional</span><span>ASR → <b>SRR</b> → SFR</span></div>
    <div class="pr"><span class="c">Allocated</span><span><b>PDR</b></span></div>
    <div class="pr"><span class="c">Product (initial)</span><span><b>CDR</b></span></div>
    <div class="pr"><span class="c">Product (final)</span><span>TRR → SVR/FCA → PRR → <b>PCA</b></span></div>
    <p>FCA and PCA are <b>audits</b>; the rest are <b>reviews</b>. Reviews should be event- or risk-driven, not schedule-driven. The set of reviews is planned in the SEMP and tailored to the project.</p>
    <h4>Gates</h4>
    <p style="margin:0">Entry gate: criteria met, resources available. Exit gate: stage objectives achieved, forward risk acceptable. A gate is a decision; a review is a technical assessment that may feed it.</p>`)}
  ${sec("Trap pairs",`
    <ul>
      <li><b>Quality Management</b> (org) vs <b>Quality Assurance</b> (tech mgmt)</li>
      <li><b>Knowledge Management</b> (org) vs <b>Information Management</b> (tech mgmt)</li>
      <li><b>Implementation</b> (one element) / <b>Integration</b> (combine) / <b>Transition</b> (field)</li>
      <li><b>Operation</b> (use) vs <b>Maintenance</b> (sustain); "Support" is a stage, not a process</li>
      <li><b>Verification</b> (specified requirements) vs <b>Validation</b> (needs, in use, intended environment)</li>
      <li><b>Recursion</b> (across levels) vs <b>iteration</b> (same level) vs <b>concurrency</b> (at the same time)</li>
      <li><b>Agility</b> (system property, §3.1.3) vs <b>agile</b> (method, §4.2.2)</li>
      <li><b>Measurement</b> supplies data; <b>Project Assessment and Control</b> uses it</li>
      <li><b>Decision Management</b> frames a trade study; <b>System Analysis</b> feeds it data</li>
      <li><b>Needs</b> (raw, elicited) vs <b>requirements</b> (agreed, well-formed, verifiable)</li>
      <li><b>Viewpoint</b> (the specification) vs <b>view</b> (the instance)</li>
      <li><b>MBSE</b> (methodology) vs <b>SysML</b> (language)</li>
    </ul>`)}
  ${sec("Count checks",`
    <ul>
      <li>6 generic life cycle stages: concept, development, production, utilization, support, retirement</li>
      <li>3 life cycle model approaches: sequential, incremental, evolutionary</li>
      <li>30 processes in 4 groups: 2 / 6 / 8 / 14</li>
      <li>4 verification methods: inspection, analysis, demonstration, test</li>
      <li>12 quality characteristics (§3.1.2–3.1.13)</li>
      <li>8 analyses and methods (§3.2.1–3.2.8)</li>
      <li>4 SoS types: directed, acknowledged, collaborative, virtual</li>
    </ul>`)}
  ${sec("Chapter 1 discriminators",`
    <h4>Systems around the SoI</h4>
    <ul><li><b>Enabling</b>: supports the SoI's life cycle (build, transport, train, dispose) but isn't delivered.</li>
    <li><b>Interfacing</b>: exchanges with the SoI in operation.</li>
    <li><b>Interoperating</b>: works jointly with the SoI toward a shared outcome.</li></ul>
    <h4>Other pairs</h4>
    <ul><li><b>Modes</b> are deliberate operational configurations; <b>states</b> are conditions at a point in time.</li>
    <li><b>Principles</b> transcend life cycle, system type and context, and aren't "how to". <b>Heuristics</b> come from experience; <b>conventions</b> from agreement.</li>
    <li><b>Aleatory</b> uncertainty is inherent randomness; <b>epistemic</b> is lack of knowledge.</li>
    <li><b>Complexity</b> is about interaction and unpredictability, not size.</li>
    <li><b>Horizontal</b> view: one level of decomposition. <b>Vertical</b>: derivation between levels.</li></ul>
    <h4>Cognitive biases (Table 1.5)</h4>
    <p style="margin:0">Framing, representativeness, availability, anchoring, motivational, optimism, confirmation, groupthink, authority, rankism. Know the name and the mitigation in one line each.</p>`)}
  ${sec("Quality characteristics and methods",`
    <h4>12 quality characteristics · §3.1</h4>
    <ul><li>Affordability — balance capability against life cycle cost within resources</li>
    <li>Agility — the system's ability to respond to change</li>
    <li>Human systems integration — the human as a system element</li>
    <li>Interoperability — exchange and use information with other systems for a shared outcome</li>
    <li>Logistics — the support system: spares, facilities, data, people</li>
    <li>Manufacturability / producibility — can it be built consistently</li>
    <li>RAM — perform when needed, for as long as needed, and be restored</li>
    <li>Resilience — anticipate, absorb, adapt to and recover from disruption, including the unforeseen</li>
    <li>Sustainability — environmental, social and economic impact over the life cycle</li>
    <li>System safety — prevent harm to people, property, environment</li>
    <li>System security — protect against deliberate hostile action</li>
    <li>Loss-driven SE — start from unacceptable losses across safety, security and mission</li></ul>
    <h4>8 methods · §3.2</h4>
    <ul><li>Modeling, analysis and simulation</li><li>Prototyping — reduce uncertainty by building something partial</li>
    <li>Traceability — coverage both ways, plus change impact</li><li>Interface management — define, control, verify</li>
    <li>Architecture frameworks — viewpoints and conventions</li><li>Patterns — reusable solutions to recurring problems</li>
    <li>Design thinking — human-centred, exploratory</li><li>Biomimicry — strategies borrowed from nature</li></ul>`)}
  ${sec("Tailoring and system types",`
    <ul><li><b>Tailoring</b> adapts process application to context, scale and risk — it can add rigour as well as remove it.</li>
    <li><b>MBSE</b>: formalised modelling across the whole life cycle. <b>Agile SE</b>: respond to change, deliver incrementally — architecture still matters. <b>Lean</b>: maximise value, remove waste in the engineering process. <b>PLE</b>: shared core assets with planned variation.</li>
    <li><b>Greenfield</b> vs <b>brownfield</b>: brownfield means designing within an installed base.</li>
    <li><b>COTS</b>: the product constrains the requirements; the vendor controls evolution.</li>
    <li><b>Cyber-physical</b>: computation and physical processes coupled by feedback.</li>
    <li><b>Enterprise</b>: people, process and organisation are engineered elements too.</li></ul>
    <h4>SoS types</h4>
    <ul><li><b>Directed</b> — built and centrally managed for a purpose; constituents subordinated</li>
    <li><b>Acknowledged</b> — recognised objectives and authority, constituents keep independence</li>
    <li><b>Collaborative</b> — voluntary cooperation, no central authority</li>
    <li><b>Virtual</b> — no central authority and no agreed purpose</li></ul>`)}
  `;
}

/* ================= PROGRESS ================= */
function rProgress(){
  const as=areaStats(), cov=procCoverage();
  const sets=S.sets.slice(-8).reverse(), rec=S.recall.slice(-5).reverse();
  main.innerHTML=`<h2>Progress</h2>
    ${readyHTML()}
    <div class="eyebrow mono">Areas · last 10 attempts · red line is 70%</div>
    ${as.map(s=>`<div class="bar"><span>${AREAS[s.k]}</span><span class="tr"><i style="width:${s.acc*100}%"></i><span class="line"></span></span><span class="v">${s.n?Math.round(s.acc*100)+"% · "+s.n:"untested"}</span></div>`).join("")}
    <div class="eyebrow mono">Process coverage · yellow correct · red missed · blank untested</div>
    ${GROUPS.map(g=>`<div class="mono small muted" style="margin:8px 0 4px">${g.n}</div><div class="cells">${cov.filter(c=>c.p.g===g.k).map(c=>`<div class="cell ${c.st}" title="${c.p.name} §${c.p.c}">${c.p.n}</div>`).join("")}</div>`).join("")}
    <div class="eyebrow mono">Recent sets</div>
    ${sets.length?sets.map(s=>`<div class="kv"><span>${dstr(s.d)} · ${s.mode}</span><span>${s.r}/${s.n} · ${pct(s.r,s.n)}%</span></div>`).join(""):`<p class="small muted">None yet.</p>`}
    <div class="eyebrow mono">Recent recall sprints</div>
    ${rec.length?rec.map(a=>`<div class="kv"><span>${dstr(a.d)}</span><span>${a.n}/30 · ${mmss(a.secs)}</span></div>`).join(""):`<p class="small muted">None yet.</p>`}
    <div class="eyebrow mono">Home-screen badge</div>
    <p class="small" style="margin:0 0 8px;line-height:1.5">Once the app is on your home screen, the icon can show how many readiness checks are still open. It clears when you're ready to book. iPhone asks for notification permission to allow this.</p>
    <button class="btn ghost" id="pbadge">Turn on icon badge</button>
    <div class="eyebrow mono">Move progress between devices</div>
    <p class="small" style="margin:0 0 8px;line-height:1.5">Progress is stored on each device. Copy the code on one, paste it on the other.</p>
    <div class="row" style="margin-top:0"><button class="btn ghost" id="pexp">Copy progress code</button><button class="btn ghost" id="pimp">Paste code</button></div>
    <textarea id="pcode" hidden aria-label="Progress code"></textarea>
    <div class="fb" id="pmsg"></div>
    <div class="row"><button class="btn ghost" id="preset" style="color:var(--fail);border-color:var(--fail)">Reset all progress</button></div>`;
  const msg=(t,c)=>{const m=document.getElementById("pmsg");m.textContent=t;m.className="fb "+(c||"");};
  document.getElementById("pbadge").addEventListener("click",async()=>{
    try{
      if(!("Notification" in window)||!("setAppBadge" in navigator)){msg("Open the app from its home-screen icon first, then try again.","bad");return;}
      const p=await Notification.requestPermission();
      if(p==="granted"){badge();msg("Badge on.","ok");}else msg("Permission not granted.","bad");
    }catch(e){msg("This browser doesn't support badges.","bad");}
  });
  const ta=document.getElementById("pcode");
  document.getElementById("pexp").addEventListener("click",async()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    ta.hidden=false;ta.value=code;ta.select();
    try{await navigator.clipboard.writeText(code);msg("Copied. Paste it on the other device.","ok");}catch(e){msg("Select the code above and copy it.","");}
  });
  document.getElementById("pimp").addEventListener("click",()=>{
    if(ta.hidden||!ta.value){ta.hidden=false;ta.value="";ta.placeholder="Paste the code here, then tap Paste code again";ta.focus();msg("");return;}
    try{const o=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));if(!o||typeof o!=="object"||!o.items)throw 0;
      S=Object.assign(def(),o);save();msg("Progress loaded.","ok");setTimeout(rProgress,600);}
    catch(e){msg("That code didn't read. Copy it again in full.","bad");}
  });
  document.getElementById("preset").addEventListener("click",()=>{
    if(!confirm("Clear all progress on this device? This can't be undone."))return;
    S=def();save();rProgress();
  });
}

/* ================= BOOT ================= */
go("today"); badge();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
